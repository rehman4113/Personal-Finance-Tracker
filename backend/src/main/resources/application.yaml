server:
  port: 8082

spring:
  application:
    name: personal-finance-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/personal_finance_manager
    username: postgres
    password: mani
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Profile picture upload (max ~5 MB per file, content-type whitelist enforced
      # in AuthServiceImpl).
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V1 was edited after being applied locally — checksums of
    # already-applied migrations therefore differ on existing databases.
    validate-on-migrate: false

springdoc:
  api-docs:
    enabled: true
    path: /api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

logging:
  level:
    org.flywaydb: INFO

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
  # Local disk location for uploaded profile pictures, served at /uploads/**.
  # In production, point this at a persistent volume / object store.
  upload-dir: ./uploads
  # Verified sender used as the From address on all outbox emails.
  mail:
    # Brevo Transactional Email API key (NOT your Brevo account password),
    # generated in Brevo dashboard → SMTP & API → API Keys.
    #
    # !!! WARNING !!!
    # This file IS TRACKED IN GIT and is NOT in .gitignore. Set the
    # BREVO_API_KEY environment variable locally — never paste the key here.
    # Leave a placeholder only when running without outbound email.
    brevo-api-key: ${BREVO_API_KEY:}
    from-address: dding5572@gmail.com
    from-name: Personal Finance Tracker

