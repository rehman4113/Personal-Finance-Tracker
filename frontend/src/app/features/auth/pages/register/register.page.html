@if (step() === 'form') {
  <app-form-header
    title="Create Account"
    subtitle="Start managing your money like a pro"
    icon="bi-person-plus"
  />

  @if (apiError()) {
    <div class="alert alert-danger d-flex align-items-start py-2 px-3" role="alert">
      <i class="bi bi-exclamation-circle me-2 mt-1"></i>
      <div>{{ apiError() }}</div>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="row g-3">
      <div class="col-sm-6">
        <div class="lux-field" [class.lux-field--filled]="form.controls.firstName.value.length > 0">
          <div class="lux-field__control">
            <i class="bi bi-person lux-field__icon" aria-hidden="true"></i>
            <input
              id="firstName"
              type="text"
              class="form-control lux-field__input"
              [class.is-invalid]="form.controls.firstName.invalid && (form.controls.firstName.dirty || form.controls.firstName.touched)"
              formControlName="firstName"
              placeholder="John"
              autocomplete="given-name"
            />
            <label class="lux-field__label" for="firstName">First name</label>
          </div>
          <app-validation-messages [control]="form.controls.firstName" />
        </div>
      </div>

      <div class="col-sm-6">
        <div class="lux-field" [class.lux-field--filled]="form.controls.lastName.value.length > 0">
          <div class="lux-field__control">
            <i class="bi bi-person lux-field__icon" aria-hidden="true"></i>
            <input
              id="lastName"
              type="text"
              class="form-control lux-field__input"
              [class.is-invalid]="form.controls.lastName.invalid && (form.controls.lastName.dirty || form.controls.lastName.touched)"
              formControlName="lastName"
              placeholder="Doe"
              autocomplete="family-name"
            />
            <label class="lux-field__label" for="lastName">Last name</label>
          </div>
          <app-validation-messages [control]="form.controls.lastName" />
        </div>
      </div>
    </div>

    <div class="lux-field" [class.lux-field--filled]="form.controls.email.value.length > 0">
      <div class="lux-field__control">
        <i class="bi bi-envelope lux-field__icon" aria-hidden="true"></i>
        <input
          id="email"
          type="email"
          class="form-control lux-field__input"
          [class.is-invalid]="form.controls.email.invalid && (form.controls.email.dirty || form.controls.email.touched)"
          formControlName="email"
          placeholder="you@gmail.com"
          autocomplete="email"
        />
        <label class="lux-field__label" for="email">Email address</label>
      </div>
      <app-validation-messages [control]="form.controls.email" />
    </div>

    <app-phone-input
      formControlName="phone"
      inputId="phone"
      label="Phone Number"
      placeholder="3001234567"
      [countryCodeControl]="form.controls.countryCode"
    />

    <app-password-input
      formControlName="password"
      label="Password"
      inputId="password"
      placeholder="Create a strong password"
      [showStrength]="true"
      [showChecklist]="true"
    />

    <app-password-input
      formControlName="confirmPassword"
      label="Confirm Password"
      inputId="confirmPassword"
      placeholder="Repeat your password"
    />

    <app-submit-button
      label="Create Account"
      icon="bi-person-plus"
      [loading]="authService.isLoading()"
      [disabled]="form.invalid"
    />
  </form>

  <div class="lux-divider">or sign up with</div>

  <div class="lux-social">
    <button type="button" class="lux-social__btn">
      <i class="bi bi-google lux-social__icon" aria-hidden="true"></i>
      Continue with Google
    </button>
  </div>

  <p class="text-center mt-4 mb-0 small auth-switch">
    Already have an account?
    <a [routerLink]="routes.LOGIN" class="text-decoration-none lux-link">Sign In</a>
  </p>
} @else {
  <app-form-header
    title="Verify your Email"
    subtitle="We sent a code to {{ registeredEmail() }}"
    icon="bi-envelope-check"
  />

  @if (apiError()) {
    <div class="alert alert-danger d-flex align-items-start py-2 px-3" role="alert">
      <i class="bi bi-exclamation-circle me-2 mt-1"></i>
      <div>{{ apiError() }}</div>
    </div>
  }

  <form [formGroup]="verifyForm" (ngSubmit)="onVerifySubmit()" novalidate>
    <label class="lux-otp-label" for="verifyOtp">Verification code</label>
    <app-otp-input formControlName="otp" />
    <app-validation-messages [control]="verifyForm.controls.otp" />

    <p class="text-center mt-3 mb-3 small auth-switch">
      @if (cooldown() > 0) {
        <span class="lux-resend-wait">Resend code in {{ cooldown() }}s</span>
      } @else {
        <button type="button" class="lux-resend" (click)="onResend()" [disabled]="resending()">
          Resend code
        </button>
      }
    </p>

    <app-submit-button
      label="Verify"
      icon="bi-check2-circle"
      [loading]="authService.isLoading()"
      [disabled]="verifyForm.invalid"
    />
  </form>

  <p class="text-center mt-4 mb-0 small auth-switch">
    Wrong details?
    <a (click)="backToForm()" class="text-decoration-none lux-link lux-clickable">Back to form</a>
  </p>
}
