<app-form-header
  title="Welcome Back"
  subtitle="Sign in to access your financial dashboard"
  icon="bi-box-arrow-in-right"
/>

@if (apiError()) {
  <div class="alert alert-danger d-flex align-items-start py-2 px-3" role="alert">
    <i class="bi bi-exclamation-circle me-2 mt-1"></i>
    <div>{{ apiError() }}</div>
  </div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="lux-field" [class.lux-field--filled]="emailControl.value.length > 0">
    <div class="lux-field__control">
      <i class="bi bi-envelope lux-field__icon" aria-hidden="true"></i>
      <input
        id="email"
        type="email"
        class="form-control lux-field__input"
        [class.is-invalid]="emailControl.invalid && (emailControl.dirty || emailControl.touched)"
        formControlName="email"
        placeholder="you@gmail.com"
        autocomplete="email"
      />
      <label class="lux-field__label" for="email">Email address</label>
    </div>
    <app-validation-messages [control]="emailControl" />
  </div>

  <app-password-input
    formControlName="password"
    label="Password"
    inputId="password"
    placeholder="Enter your password"
  />

  <div class="d-flex justify-content-between align-items-center mb-3 mt-1">
    <div class="form-check lux-check">
      <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe" />
      <label class="form-check-label" for="rememberMe">Remember me</label>
    </div>
    <a routerLink="/forgot-password" class="small text-decoration-none lux-link">Forgot password?</a>
  </div>

  <app-submit-button
    label="Sign In"
    icon="bi-box-arrow-in-right"
    [loading]="authService.isLoading()"
    [disabled]="form.invalid"
  />
</form>

<div class="lux-divider">or continue with</div>

<div class="lux-social">
  <button type="button" class="lux-social__btn">
    <i class="bi bi-google lux-social__icon" aria-hidden="true"></i>
    Continue with Google
  </button>
</div>

<p class="text-center mt-4 mb-0 small auth-switch">
  Don't have an account?
  <a [routerLink]="routes.REGISTER" class="text-decoration-none lux-link">Register</a>
</p>
