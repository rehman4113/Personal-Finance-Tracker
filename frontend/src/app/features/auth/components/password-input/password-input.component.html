<div class="password-input mb-2">
  <label [for]="inputId()" class="form-label">{{ label() }}</label>
  <div class="input-group">
    <span class="input-group-text"><i class="bi bi-lock"></i></span>
    <input
      [id]="inputId()"
      [type]="visible() ? 'text' : 'password'"
      class="form-control form-control-lg-custom"
      [class.is-invalid]="validationControl.invalid && (validationControl.dirty || validationControl.touched)"
      [placeholder]="placeholder()"
      [value]="currentValue()"
      [disabled]="validationControl.disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [autocomplete]="inputId() === 'confirmPassword' ? 'new-password' : 'current-password'"
    />
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="toggleVisibility()"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    >
      <i [class]="visible() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
    </button>
  </div>

  <app-validation-messages [control]="$any(validationControl)" />

  @if (showStrength() && hasValue) {
    <div class="password-strength mt-2">
      <div class="d-flex justify-content-between small mb-1">
        <span class="text-muted">Strength</span>
        <span [class]="'strength-label strength-label--' + strength()">{{ strengthText() }}</span>
      </div>
      <div class="progress" style="height: 4px">
        <div
          class="progress-bar"
          [class]="'bg-strength-' + strength()"
          [style.width.%]="strengthWidth()"
        ></div>
      </div>
    </div>
  }

  @if (showChecklist() && hasValue) {
    <ul class="password-checklist list-unstyled small mt-2 mb-0">
      @for (req of requirements(); track req.label) {
        <li [class.text-success]="req.met" [class.text-muted]="!req.met">
          <i [class]="req.met ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          {{ req.label }}
        </li>
      }
    </ul>
  }
</div>
